<div *ngIf="worldItem" class="world-item-detail">
  <h2>World Item Details</h2>
  <p><strong>ID:</strong> {{ worldItem.id }}</p>
  <p><strong>Country:</strong> {{ worldItem.country }}</p>
  <p><strong>City:</strong> {{ worldItem.city }}</p>
  <p><strong>Language:</strong> {{ worldItem.language }}</p>
  <p><strong>Game:</strong> {{ worldItem.game }}</p>
  <p><strong>Food:</strong> {{ worldItem.food }}</p>

  <button (click)="onBackward()" [disabled]="currentIndex === 0">Previous</button>
  <button (click)="onForward()" [disabled]="currentIndex === worldItem.length - 1">Next</button>
  <button (click)="goBack()">Back to world item list</button>
</div>
<div *ngIf="error" class="error">{{ error }}</div>
