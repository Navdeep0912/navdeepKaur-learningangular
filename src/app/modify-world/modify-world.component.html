<!-- modify-student.component.html -->
<form [formGroup]="worldForm" (ngSubmit)="onSubmit()">
  <!-- ID Field -->
  <div class="form-group">
    <label for="id">ID</label>
    <input type="number" id="id" formControlName="id" />
  </div>

  <!-- City Name Field -->
  <div class="form-group">
    <label for="cityName">City</label>
    <input type="text" id="cityName" formControlName="cityName" />
  </div>

  <!-- Country Name Field -->
  <div class="form-group">
    <label for="countryName">Country Name</label>
    <input type="text" id="countryName" formControlName="countryName" />
  </div>

  <!-- Language Field -->
  <div class="form-group">
    <label for="language">Language</label>
    <input type="text" id="language" formControlName="language" />
  </div>

  <!-- Food -->
  <div class="form-group">
    <label for="food">Food</label>
    <input type="text" id="food" formControlName="food" />
  </div>

  <!-- Submit Button (Add or Update) -->
  <button type="submit">Submit</button>

  <!-- Delete Button (Always Displayed Now) -->
  <button type="button" (click)="onDelete()">Delete</button>

  <!-- Back Button -->
  <button type="button" (click)="navigateToWorldList()">Back to List</button>
</form>
